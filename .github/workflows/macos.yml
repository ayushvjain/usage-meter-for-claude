name: macOS

# Builds the Mac app on a real Mac (GitHub's macOS runner), checks that the widget starts
# and pins itself to the desktop layer, and saves a screenshot. On a published release it
# also attaches the .dmg files to that release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/macos.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      # No Apple Developer certificate yet, so don't look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Smoke test on the desktop
        run: |
          USAGE_METER_DEBUG_DESKTOP=1 npx electron . > smoke.log 2>&1 &
          APP_PID=$!
          sleep 25
          screencapture -x smoke-desktop.png || echo "screenshot failed"
          kill "$APP_PID" || true
          sleep 2
          echo "----- app log -----"
          cat smoke.log
          echo "-------------------"
          if grep -q "\[desktop-layer\] pinned.* ok" smoke.log; then
            echo "Widget is on the desktop layer."
          else
            echo "::error::The widget did not report the desktop window level. See smoke.log."
            exit 1
          fi

      - name: Build the .dmg files
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: |
            dist/*.dmg
            smoke.log
            smoke-desktop.png
          if-no-files-found: warn

  attach-to-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - name: Attach the .dmg files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber --repo "${{ github.repository }}"
